<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>작품 촬영 테스트</title>
  <style>
    :root{
      --bg:#f4f4f2;
      --panel:#ffffff;
      --text:#151515;
      --muted:#747474;
      --line:#e6e5e1;
      --accent:#151515;
      --danger:#b42318;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    .wrap{
      width:min(100%,720px);
      margin:0 auto;
      padding:20px 16px calc(32px + env(safe-area-inset-bottom));
    }
    h1{font-size:24px;margin:4px 0 6px}
    .desc{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.55}
    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:16px;
    }
    label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
    input[type="text"]{
      width:100%;
      height:50px;
      border:1px solid #d9d8d4;
      border-radius:12px;
      padding:0 14px;
      font-size:17px;
      outline:none;
      background:#fff;
    }
    input[type="text"]:focus{border-color:#777}
    .capture{
      width:100%;
      min-height:56px;
      margin-top:12px;
      border:0;
      border-radius:14px;
      background:var(--accent);
      color:#fff;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }
    .capture:active{transform:scale(.99)}
    #cameraInput{display:none}
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin:24px 2px 10px;
    }
    .section-head h2{margin:0;font-size:18px}
    .count{
      color:var(--muted);
      font-size:13px;
      white-space:nowrap;
    }
    .empty{
      border:1px dashed #cccac3;
      border-radius:16px;
      padding:34px 18px;
      text-align:center;
      color:var(--muted);
      background:rgba(255,255,255,.45);
      line-height:1.6;
    }
    .list{
      display:grid;
      gap:12px;
    }
    .item{
      display:grid;
      grid-template-columns:104px minmax(0,1fr);
      gap:13px;
      padding:12px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      align-items:center;
    }
    .thumb{
      width:104px;
      height:104px;
      object-fit:cover;
      background:#eee;
      border-radius:12px;
      display:block;
    }
    .meta{min-width:0}
    .filename{
      font-weight:800;
      font-size:15px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .sub{
      color:var(--muted);
      font-size:12px;
      margin-top:5px;
    }
    .actions{
      display:flex;
      gap:8px;
      margin-top:12px;
    }
    .btn{
      min-height:38px;
      border-radius:10px;
      border:1px solid #d8d7d2;
      background:#fff;
      padding:0 12px;
      font-weight:700;
      cursor:pointer;
    }
    .btn.primary{
      border-color:#151515;
      background:#151515;
      color:#fff;
    }
    .btn.delete{color:var(--danger)}
    .notice{
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      background:#ecebe7;
      color:#5d5d5d;
      font-size:12px;
      line-height:1.55;
    }
    @media (max-width:480px){
      .wrap{padding-top:14px}
      h1{font-size:22px}
      .item{grid-template-columns:88px minmax(0,1fr)}
      .thumb{width:88px;height:88px}
      .actions{flex-wrap:wrap}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>작품 촬영 테스트</h1>
    <p class="desc">작품명을 입력한 뒤 촬영하세요. 촬영한 사진은 아래에 계속 쌓이고, 저장 파일명은 작품명 기준으로 자동 생성됩니다.</p>

    <section class="panel">
      <label for="artworkName">작품명</label>
      <input id="artworkName" type="text" placeholder="예: 무제" autocomplete="off">
      <button id="captureBtn" class="capture" type="button">📷 사진 촬영</button>
      <input id="cameraInput" type="file" accept="image/*" capture="environment">
      <div class="notice">
        휴대폰에서 열면 촬영 버튼을 눌렀을 때 후면 카메라가 우선 실행됩니다. 기기/브라우저 설정에 따라 카메라 또는 사진 선택 메뉴가 함께 표시될 수 있습니다.
      </div>
    </section>

    <div class="section-head">
      <h2>촬영한 사진</h2>
      <div id="count" class="count">0장</div>
    </div>

    <div id="empty" class="empty">
      아직 촬영한 사진이 없습니다.<br>위의 <b>사진 촬영</b> 버튼을 눌러 테스트해 보세요.
    </div>
    <div id="photoList" class="list" aria-live="polite"></div>
  </main>

  <script>
    const artworkName = document.getElementById('artworkName');
    const captureBtn = document.getElementById('captureBtn');
    const cameraInput = document.getElementById('cameraInput');
    const photoList = document.getElementById('photoList');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');

    const photos = [];

    function sanitizeFileName(name) {
      return name
        .trim()
        .replace(/[\\/:*?"<>|]/g, '_')
        .replace(/\s+/g, ' ')
        .replace(/\.+$/g, '')
        || '작품';
    }

    function extensionFor(file) {
      const typeMap = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/webp': 'webp',
        'image/heic': 'heic',
        'image/heif': 'heif'
      };
      if (typeMap[file.type]) return typeMap[file.type];

      const original = file.name || '';
      const m = original.match(/\.([a-zA-Z0-9]+)$/);
      return m ? m[1].toLowerCase() : 'jpg';
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function makeRenamedFile(originalFile, index, title) {
      const ext = extensionFor(originalFile);
      const filename = `${sanitizeFileName(title)}_${String(index).padStart(2, '0')}.${ext}`;

      try {
        return new File([originalFile], filename, {
          type: originalFile.type || 'image/jpeg',
          lastModified: originalFile.lastModified || Date.now()
        });
      } catch (e) {
        // 구형 브라우저 대응용 fallback
        originalFile._displayName = filename;
        return originalFile;
      }
    }

    function render() {
      photoList.innerHTML = '';
      count.textContent = `${photos.length}장`;
      empty.style.display = photos.length ? 'none' : 'block';

      photos.forEach((photo, i) => {
        const item = document.createElement('article');
        item.className = 'item';

        const img = document.createElement('img');
        img.className = 'thumb';
        img.src = photo.url;
        img.alt = `${photo.filename} 미리보기`;

        const meta = document.createElement('div');
        meta.className = 'meta';

        const filename = document.createElement('div');
        filename.className = 'filename';
        filename.textContent = photo.filename;

        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = `${formatBytes(photo.file.size)} · ${new Date(photo.createdAt).toLocaleString('ko-KR')}`;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn primary';
        saveBtn.type = 'button';
        saveBtn.textContent = '사진 저장';
        saveBtn.addEventListener('click', () => {
          const a = document.createElement('a');
          a.href = photo.url;
          a.download = photo.filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn delete';
        deleteBtn.type = 'button';
        deleteBtn.textContent = '삭제';
        deleteBtn.addEventListener('click', () => {
          URL.revokeObjectURL(photo.url);
          photos.splice(i, 1);
          renumberPhotos();
          render();
        });

        actions.append(saveBtn, deleteBtn);
        meta.append(filename, sub, actions);
        item.append(img, meta);
        photoList.appendChild(item);
      });
    }

    function renumberPhotos() {
      const title = sanitizeFileName(artworkName.value);
      photos.forEach((photo, index) => {
        const ext = extensionFor(photo.originalFile);
        photo.filename = `${title}_${String(index + 1).padStart(2, '0')}.${ext}`;
        try {
          photo.file = new File([photo.originalFile], photo.filename, {
            type: photo.originalFile.type || 'image/jpeg',
            lastModified: photo.originalFile.lastModified || Date.now()
          });
        } catch (e) {}
      });
    }

    captureBtn.addEventListener('click', () => {
      if (!artworkName.value.trim()) {
        artworkName.focus();
        alert('먼저 작품명을 입력해 주세요.');
        return;
      }

      // 같은 파일을 다시 선택/촬영해도 change 이벤트가 발생하도록 초기화
      cameraInput.value = '';
      cameraInput.click();
    });

    cameraInput.addEventListener('change', () => {
      const originalFile = cameraInput.files && cameraInput.files[0];
      if (!originalFile) return;

      const index = photos.length + 1;
      const title = artworkName.value;
      const renamedFile = makeRenamedFile(originalFile, index, title);
      const filename = renamedFile.name || renamedFile._displayName || `${sanitizeFileName(title)}_${String(index).padStart(2, '0')}.${extensionFor(originalFile)}`;
      const url = URL.createObjectURL(originalFile);

      photos.push({
        originalFile,
        file: renamedFile,
        filename,
        url,
        createdAt: Date.now()
      });

      render();
    });

    artworkName.addEventListener('change', () => {
      if (photos.length) {
        renumberPhotos();
        render();
      }
    });

    window.addEventListener('beforeunload', () => {
      photos.forEach(photo => URL.revokeObjectURL(photo.url));
    });

    render();
  </script>
</body>
</html>
